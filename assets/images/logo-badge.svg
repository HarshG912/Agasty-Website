<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="badge-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#030712"/>
            <stop offset="100%" stop-color="#0b0f19"/>
        </linearGradient>
        <linearGradient id="badge-border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(56,189,248,0.5)"/>
            <stop offset="50%" stop-color="rgba(59,130,246,0.3)"/>
            <stop offset="100%" stop-color="rgba(99,102,241,0.4)"/>
        </linearGradient>
        <linearGradient id="badge-left" x1="16" y1="84" x2="48" y2="14" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="badge-right" x1="52" y1="14" x2="84" y2="84" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="badge-core" x1="36" y1="54" x2="64" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
    </defs>
    <!-- Dark Enterprise Squircle Container -->
    <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#badge-bg)"/>
    <rect x="2" y="2" width="96" height="96" rx="26" stroke="url(#badge-border)" stroke-width="1.5"/>
    <!-- Logo Monogram Vector -->
    <g transform="translate(10, 10) scale(0.8)">
        <path d="M 18 84 L 46 15 C 47.5 12.5 50 12.5 50 12.5 L 42 42 L 31 84 Z" fill="url(#badge-left)"/>
        <path d="M 50 12.5 C 50 12.5 52.5 12.5 54 15 L 82 84 L 69 84 L 58 42 Z" fill="url(#badge-right)"/>
        <polygon points="50,40 64,54 50,68 36,54" fill="url(#badge-core)"/>
        <polygon points="50,46 56,54 50,62 44,54" fill="#030712"/>
        <circle cx="50" cy="54" r="2.5" fill="#ffffff"/>
    </g>
